<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>极简悬浮窗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;min-height:100vh;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}

/* 容器：采用 flex 布局，靠右下角对齐 */
.floating-widget{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:calc(24px + env(safe-area-inset-right,0px));z-index:9999;touch-action:none;display:flex;flex-direction:row;align-items:flex-end;gap:12px}

/* 悬浮球变小：48px */
.widget-toggle{width:48px;height:48px;border-radius:50%;background:rgba(30,30,30,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;overflow:hidden;flex-shrink:0}
.widget-toggle img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;pointer-events:none}
.widget-toggle:active{transform:scale(.92)}

/* 菜单面板变大：300px，位于左侧 */
.widget-panel{width:300px;background:#fff;border-radius:18px;padding:22px 20px;display:none;flex-direction:column;gap:14px;transform-origin:left bottom;animation:panelIn .22s cubic-bezier(.2,.9,.3,1);color:#333;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.widget-panel.active{display:flex}
@keyframes panelIn{0%{opacity:0;transform:scale(.92) translateX(-10px)}100%{opacity:1;transform:scale(1) translateX(0)}}

.panel-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #eee}
.panel-header h3{font-size:17px;font-weight:600;color:#222}
.close-btn{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#999;font-size:20px;cursor:pointer;padding-bottom:2px}
.close-btn:active{background:#f0f0f0;color:#333}
.panel-content{text-align:left}

.declare-text{font-size:14px;line-height:1.7;color:#555}
.declare-text p{margin-bottom:10px;text-align:left}
.declare-text p:last-child{margin-bottom:0}

@media(hover:hover) and (pointer:fine){.widget-toggle:hover{background:rgba(50,50,50,.95)}.close-btn:hover{background:#f0f0f0;color:#333}}

/* 移动端适配 */
@media(max-width:480px){
.floating-widget{bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px));gap:10px}
.widget-toggle{width:42px;height:42px}
.widget-panel{width:min(280px,calc(100vw - 70px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));padding:18px 16px;gap:12px;border-radius:16px}
.panel-header h3{font-size:16px}.declare-text{font-size:13px;line-height:1.6}.close-btn{width:24px;height:24px;font-size:18px}
}
@media(max-height:500px){.widget-panel{max-height:calc(100vh - 100px);overflow-y:auto;-webkit-overflow-scrolling:touch}}
</style>
</head>
<body>
<div id="floatingWidget" class="floating-widget">
  
  <!-- 声明面板（在左） -->
  <div id="widgetPanel" class="widget-panel">
    <div class="panel-header">
      <h3>免责声明</h3>
      <button id="closePanelBtn" class="close-btn" title="关闭">×</button>
    </div>
    <div class="panel-content">
      <div class="declare-text">
        <p>使用者应自行承担因使用本工具产生的全部风险，包括但不限于数据丢失、系统异常等。</p>
        <p>作者保留对本声明的最终解释权。如果用户做出违法行为我们不负责</p>
        <p>若用户，做出违法行为，我们不会负责</p>
      </div>
    </div>
  </div>

  <!-- 悬浮球（在右） -->
  <div id="widgetToggle" class="widget-toggle" title="点击展开/关闭悬浮窗">
    <img src="floating.png" alt="floating" draggable="false">
  </div>

</div>
<script>
(function(){
'use strict';
const widget=document.getElementById('floatingWidget');
const toggleBtn=document.getElementById('widgetToggle');
const panel=document.getElementById('widgetPanel');
const closeBtn=document.getElementById('closePanelBtn');

toggleBtn.addEventListener('click',e=>{e.stopPropagation();panel.classList.toggle('active')});
closeBtn.addEventListener('click',e=>{e.stopPropagation();panel.classList.remove('active')});
document.addEventListener('click',e=>{if(!widget.contains(e.target))panel.classList.remove('active')});
panel.addEventListener('click',e=>e.stopPropagation());

let isDragging=false,hasMoved=false,startX=0,startY=0,startLeft=0,startTop=0,pointerDown=false;
const MOVE_THRESHOLD=8;

function initPosition(){
  if(widget.style.left&&widget.style.top)return;
  const rect=widget.getBoundingClientRect();
  widget.style.bottom='auto';widget.style.right='auto';
  widget.style.left=rect.left+'px';widget.style.top=rect.top+'px';
  startLeft=rect.left;startTop=rect.top;
}

function dragStart(e){
  if(e.type==='mousedown'&&e.button!==0)return;
  initPosition();
  const p=e.touches?e.touches[0]:e;
  startX=p.clientX;startY=p.clientY;
  const s=window.getComputedStyle(widget);
  startLeft=parseFloat(s.left)||0;startTop=parseFloat(s.top)||0;
  pointerDown=true;hasMoved=false;isDragging=false;
  if(e.type==='mousedown'){
    document.addEventListener('mousemove',onDragMove);
    document.addEventListener('mouseup',onDragEnd);
  }else{
    document.addEventListener('touchmove',onDragMove,{passive:false});
    document.addEventListener('touchend',onDragEnd);
    document.addEventListener('touchcancel',onDragEnd);
  }
}

function onDragMove(e){
  if(!pointerDown)return;
  const p=e.touches?e.touches[0]:e;
  const dx=p.clientX-startX,dy=p.clientY-startY;
  if(!hasMoved&&(Math.abs(dx)>MOVE_THRESHOLD||Math.abs(dy)>MOVE_THRESHOLD)){
    hasMoved=true;isDragging=true;
    widget.style.transition='none';widget.style.willChange='left,top';
  }
  if(!hasMoved)return;
  if(e.type==='touchmove')e.preventDefault();
  let nl=startLeft+dx,nt=startTop+dy;
  const rect=widget.getBoundingClientRect();
  const maxL=window.innerWidth-rect.width,maxT=window.innerHeight-rect.height;
  nl=Math.max(0,Math.min(nl,maxL));nt=Math.max(0,Math.min(nt,maxT));
  widget.style.left=nl+'px';widget.style.top=nt+'px';
}

function onDragEnd(){
  if(!pointerDown)return;
  document.removeEventListener('mousemove',onDragMove);
  document.removeEventListener('mouseup',onDragEnd);
  document.removeEventListener('touchmove',onDragMove);
  document.removeEventListener('touchend',onDragEnd);
  document.removeEventListener('touchcancel',onDragEnd);
  widget.style.willChange='auto';
  if(hasMoved){
    const preventClick=ev=>{ev.stopPropagation();ev.preventDefault()};
    document.addEventListener('click',preventClick,{capture:true,once:true});
    setTimeout(()=>document.removeEventListener('click',preventClick,{capture:true}),100);
  }
  pointerDown=false;isDragging=false;hasMoved=false;
}

widget.addEventListener('mousedown',dragStart);
widget.addEventListener('touchstart',dragStart,{passive:true});
widget.addEventListener('contextmenu',e=>e.preventDefault());

function clampPosition(){
  if(!widget.style.left||!widget.style.top)return;
  const rect=widget.getBoundingClientRect();
  let left=parseFloat(widget.style.left),top=parseFloat(widget.style.top);
  const maxL=window.innerWidth-rect.width,maxT=window.innerHeight-rect.height;
  if(left>maxL)left=maxL;if(top>maxT)top=maxT;
  if(left<0)left=0;if(top<0)top=0;
  widget.style.left=left+'px';widget.style.top=top+'px';
}
window.addEventListener('resize',clampPosition);
window.addEventListener('orientationchange',()=>setTimeout(clampPosition,200));

panel.classList.remove('active');
})();
</script>
</body>
</html>
